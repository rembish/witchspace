# The Python tooling of the reconstruction (re/tools, re/emu): the unpacker, the control-flow
# recovery and table check, and the emulator harness that runs the original next to the core;
# and tools/make_icon.py, the icon's sizes from its drawing.
# The game itself is C (core/, src/); nothing here is needed to build or play it.
#
#   uv sync --extra dev          the environment (.venv)
#   make py-check                format check, lint, strict type check
[project]
name = "witchspace-tools"
version = "0.1.7"
description = "Reverse-engineering and differential-test tools for Witchspace"
requires-python = ">=3.12"
license = "BSD-3-Clause"
dependencies = [
    "unicorn>=2.1",    # the x86 emulator the original runs in
    "capstone>=5.0",   # the disassembler (control-flow recovery, the harness's divisions)
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "playwright>=1.44",   # web/ smoke test in a headless browser
    "pillow>=10",         # tools/make_icon.py
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110  # as .clang-format
target-version = "py312"
src = ["re/tools", "re/emu", "tools"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "BLE"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.mypy]
strict = true
python_version = "3.12"
files = ["re/tools", "re/emu", "tools"]
mypy_path = ["re/tools", "re/emu"]
explicit_package_bases = true

# capstone ships no type information
[[tool.mypy.overrides]]
module = ["capstone", "capstone.*"]
ignore_missing_imports = true
